# File: Basic_Registration_Flow.yaml
id: 019b4542-4d4f-7280-bb7c-cf31470ccdff
handle: default-basic-flow
name: Basic Registration Flow
flowType: REGISTRATION
activeVersion: 4
nodes:
  - id: start
    type: START
    onSuccess: user_type_resolver
  - id: user_type_resolver
    type: TASK_EXECUTION
    executor:
      name: UserTypeResolver
    onSuccess: basic_auth
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: provisioning
  - id: provisioning
    type: TASK_EXECUTION
    inputs:
      - ref: input_001
        type: TEXT_INPUT
        identifier: username
        required: true
      - ref: input_002
        type: PASSWORD_INPUT
        identifier: password
        required: true
      - ref: input_003
        type: TEXT_INPUT
        identifier: firstName
        required: true
      - ref: input_004
        type: TEXT_INPUT
        identifier: lastName
        required: true
      - ref: input_005
        type: TEXT_INPUT
        identifier: email
        required: true
    executor:
      name: ProvisioningExecutor
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
createdAt: 2025-12-22 08:52:11
updatedAt: 2025-12-22 08:54:40
