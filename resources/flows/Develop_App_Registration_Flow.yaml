# File: Develop_App_Registration_Flow.yaml
id: 019b4969-0fa9-7854-9163-d76b43b4faec
handle: develop-app-flow
name: Develop App Registration Flow
flowType: REGISTRATION
activeVersion: 2
nodes:
  - id: start
    type: START
    onSuccess: user_type_resolver
  - id: user_type_resolver
    type: TASK_EXECUTION
    executor:
      name: UserTypeResolver
    onSuccess: prompt_registration
  - id: prompt_registration
    type: PROMPT
    meta: {"components":[{"id":"text_001","label":"{{ t(signup:heading) }}","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"{{ t(elements:fields.username.label) }}","placeholder":"{{ t(elements:fields.username.placeholder) }}","ref":"username","required":true,"type":"TEXT_INPUT"},{"id":"input_002","label":"{{ t(elements:fields.password.label) }}","placeholder":"{{ t(elements:fields.password.placeholder) }}","ref":"password","required":true,"type":"PASSWORD_INPUT"},{"id":"input_003","label":"{{ t(elements:fields.first_name.label) }}","placeholder":"{{ t(elements:fields.first_name.placeholder) }}","ref":"firstName","required":true,"type":"TEXT_INPUT"},{"id":"input_004","label":"{{ t(elements:fields.last_name.label) }}","placeholder":"{{ t(elements:fields.last_name.placeholder) }}","ref":"lastName","required":true,"type":"TEXT_INPUT"},{"id":"input_005","label":"{{ t(elements:fields.email.label) }}","placeholder":"{{ t(elements:fields.email.placeholder) }}","ref":"email","required":true,"type":"EMAIL_INPUT"},{"eventType":"SUBMIT","id":"action_001","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"}]}
    inputs:
      - ref: input_001
        type: TEXT_INPUT
        identifier: username
        required: true
      - ref: input_002
        type: PASSWORD_INPUT
        identifier: password
        required: true
      - ref: input_003
        type: TEXT_INPUT
        identifier: firstName
        required: true
      - ref: input_004
        type: TEXT_INPUT
        identifier: lastName
        required: true
      - ref: input_005
        type: TEXT_INPUT
        identifier: email
        required: true
    actions:
      - ref: action_001
        nextNode: basic_auth
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: provisioning
  - id: provisioning
    type: TASK_EXECUTION
    inputs:
      - ref: input_001
        type: TEXT_INPUT
        identifier: username
        required: true
      - ref: input_002
        type: PASSWORD_INPUT
        identifier: password
        required: true
      - ref: input_003
        type: TEXT_INPUT
        identifier: firstName
        required: true
      - ref: input_004
        type: TEXT_INPUT
        identifier: lastName
        required: true
      - ref: input_005
        type: TEXT_INPUT
        identifier: email
        required: true
    executor:
      name: ProvisioningExecutor
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
createdAt: 2025-12-23 04:13:00
updatedAt: 2025-12-23 04:13:00


