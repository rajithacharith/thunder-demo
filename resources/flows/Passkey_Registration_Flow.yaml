# File: Passkey_Registration_Flow.yaml
id: 019bf5b6-b713-7dda-9f7b-a2a82d2a379f
handle: passkey_registration_flow
name: Passkey Registration Flow
flowType: REGISTRATION
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: user_type_resolver
  - id: user_type_resolver
    type: TASK_EXECUTION
    meta: {"components":[{"id":"usertype_heading","label":"{{ t(signup:heading) }}","type":"TEXT","variant":"HEADING_2"},{"components":[{"id":"usertype_input","label":"{{ t(elements:fields.usertype.label) }}","placeholder":"{{ t(elements:fields.usertype.placeholder) }}","ref":"userType","required":true,"type":"SELECT"},{"eventType":"SUBMIT","id":"usertype_submit","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"usertype_block","type":"BLOCK"}]}
    executor:
      name: UserTypeResolver
    onSuccess: collect_user_info
  - id: collect_user_info
    type: PROMPT
    meta: {"components":[{"id":"text_001","label":"{{ t(signup:heading) }}","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"{{ t(elements:fields.username.label) }}","placeholder":"{{ t(elements:fields.username.placeholder) }}","ref":"username","required":true,"type":"TEXT_INPUT"},{"id":"input_002","label":"{{ t(elements:fields.email.label) }}","placeholder":"{{ t(elements:fields.email.placeholder) }}","ref":"email","required":true,"type":"TEXT_INPUT"},{"eventType":"SUBMIT","id":"action_001","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"}]}
    prompts:
      - inputs:
          - ref: input_001
            type: TEXT_INPUT
            identifier: username
            required: true
          - ref: input_002
            type: TEXT_INPUT
            identifier: email
            required: true
        action:
          ref: action_001
          nextNode: provisioning
  - id: provisioning
    type: TASK_EXECUTION
    executor:
      name: ProvisioningExecutor
    onSuccess: passkey_reg_start
  - id: passkey_reg_start
    type: TASK_EXECUTION
    properties:
      attestation: "direct"
      authenticatorSelection: {"authenticatorAttachment":"platform","requireResidentKey":true,"residentKey":"required","userVerification":"required"}
      relyingPartyId: "localhost"
      relyingPartyName: "Thunder"
    executor:
      name: PasskeyAuthExecutor
      mode: register_start
    onSuccess: passkey_reg_finish
  - id: passkey_reg_finish
    type: TASK_EXECUTION
    executor:
      name: PasskeyAuthExecutor
      mode: register_finish
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
createdAt: 2026-01-25 15:12:30
updatedAt: 2026-01-25 15:12:30

