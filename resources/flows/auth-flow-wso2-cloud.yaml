id: "019b34c3-eed4-7a63-be15-90dc8e80f675"
handle: "default-basic-flow"
name: "Basic Authentication Flow - New"
flowType: "AUTHENTICATION"
activeVersion: 2
nodes:
  - id: "start"
    type: "START"
    onSuccess: "basic_auth"
  - id: "basic_auth"
    type: "TASK_EXECUTION"
    inputs:
      - ref: "input_001"
        type: "TEXT_INPUT"
        identifier: "username"
        required: true
      - ref: "input_002"
        type: "PASSWORD_INPUT"
        identifier: "password"
        required: true
    executor:
      name: "BasicAuthExecutor"
    onSuccess: "authorization_check"
  - id: "authorization_check"
    type: "TASK_EXECUTION"
    executor:
      name: "AuthorizationExecutor"
    onSuccess: "auth_assert"
  - id: "auth_assert"
    type: "TASK_EXECUTION"
    executor:
      name: "AuthAssertExecutor"
    onSuccess: "end"
  - id: "end"
    type: "END"
