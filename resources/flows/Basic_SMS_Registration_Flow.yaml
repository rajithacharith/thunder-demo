# File: Basic_SMS_Registration_Flow.yaml
id: 019bec22-dba3-7d8c-b4c9-0dc909e66cc5
handle: auth-flow-basic-sms
name: Basic SMS Registration Flow
flowType: REGISTRATION
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: ut_res_node
  - id: prompt_credentials
    type: PROMPT
    meta: {"components":[{"id":"text_001","label":"{{ t(signin:heading) }}","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"{{ t(elements:fields.username.label) }}","placeholder":"{{ t(elements:fields.username.placeholder) }}","ref":"username","required":true,"type":"TEXT_INPUT"},{"id":"input_002","label":"{{ t(elements:fields.password.label) }}","placeholder":"{{ t(elements:fields.password.placeholder) }}","ref":"password","required":true,"type":"PASSWORD_INPUT"},{"eventType":"SUBMIT","id":"action_001","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"}]}
    prompts:
      - inputs:
          - ref: input_001
            type: TEXT_INPUT
            identifier: username
            required: true
          - ref: input_002
            type: PASSWORD_INPUT
            identifier: password
            required: true
        action:
          ref: action_001
          nextNode: basic_auth
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: send_sms
  - id: send_sms
    type: TASK_EXECUTION
    properties:
      senderId: "\u003csender-id\u003e"
    executor:
      name: SMSOTPAuthExecutor
      mode: send
    onSuccess: prompt_otp
  - id: prompt_otp
    type: PROMPT
    prompts:
      - inputs:
          - ref: input_002
            type: TEXT_INPUT
            identifier: otp
            required: true
        action:
          ref: action_001
          nextNode: verify_sms
  - id: verify_sms
    type: TASK_EXECUTION
    properties:
      senderId: "\u003csender-id\u003e"
    executor:
      name: SMSOTPAuthExecutor
      mode: verify
    onSuccess: prov_node
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
  - id: prov_node
    type: TASK_EXECUTION
    executor:
      name: ProvisioningExecutor
    onSuccess: auth_assert
  - id: ut_res_node
    type: TASK_EXECUTION
    meta: {"components":[{"id":"usertype_heading","label":"{{ t(signup:heading) }}","type":"TEXT","variant":"HEADING_2"},{"components":[{"id":"usertype_input","label":"{{ t(elements:fields.usertype.label) }}","placeholder":"{{ t(elements:fields.usertype.placeholder) }}","ref":"userType","required":true,"type":"SELECT"},{"eventType":"SUBMIT","id":"usertype_submit","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"usertype_block","type":"BLOCK"}]}
    executor:
      name: UserTypeResolver
    onSuccess: prompt_credentials
createdAt: 2026-01-23 18:34:26
updatedAt: 2026-01-23 18:34:26


