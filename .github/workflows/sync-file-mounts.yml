name: Sync File Mounts to Choreo

on:
  push:
    branches:
      - resources
    paths:
      - 'resources/**/*.yaml'

jobs:
  sync-file-mounts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch current and previous commit for diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run file mount synchronization
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ORG_UUID: ${{ vars.ORG_UUID }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          COMPONENT_ID: ${{ vars.COMPONENT_ID }}
          ENV_ID: ${{ vars.ENV_ID }}
          APP_ENV_ID: ${{ vars.APP_ENV_ID }}
        run: |
          python scripts/sync_file_mounts.py
      
      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: |
            sync-report.txt
          retention-days: 30
