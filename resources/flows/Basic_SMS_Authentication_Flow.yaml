# File: Basic_SMS_Authentication_Flow.yaml
id: 019bf5b6-b62e-7aca-b6bf-2592bced59a7
handle: auth-flow-basic-sms
name: Basic SMS Authentication Flow
flowType: AUTHENTICATION
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: prompt_credentials
  - id: prompt_credentials
    type: PROMPT
    meta: {"components":[{"id":"text_001","label":"Sign In","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"Username","placeholder":"Enter your username","ref":"username","required":true,"type":"TEXT_INPUT"},{"id":"input_002","label":"Password","placeholder":"Enter your password","ref":"password","required":true,"type":"PASSWORD_INPUT"},{"eventType":"SUBMIT","id":"action_001","label":"Sign In","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"}]}
    prompts:
      - inputs:
          - ref: input_001
            type: TEXT_INPUT
            identifier: username
            required: true
          - ref: input_002
            type: PASSWORD_INPUT
            identifier: password
            required: true
        action:
          ref: action_001
          nextNode: basic_auth
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: send_sms
  - id: send_sms
    type: TASK_EXECUTION
    properties:
      senderId: "\u003csender-id\u003e"
    executor:
      name: SMSOTPAuthExecutor
      mode: send
    onSuccess: prompt_otp
  - id: prompt_otp
    type: PROMPT
    meta: {"components":[{"category":"DISPLAY","id":"text_001","label":"Verify OTP","resourceType":"ELEMENT","type":"TEXT","variant":"HEADING_3"},{"category":"BLOCK","components":[{"category":"FIELD","hint":"","id":"input_002","inputType":"text","label":"Enter the OTP code","placeholder":"","ref":"otp","required":true,"resourceType":"ELEMENT","type":"OTP_INPUT"},{"category":"ACTION","eventType":"SUBMIT","id":"action_001","label":"Verify","resourceType":"ELEMENT","type":"ACTION","variant":"PRIMARY"},{"category":"ACTION","eventType":"SUBMIT","id":"resend_001","label":"Resend OTP","resourceType":"ELEMENT","type":"RESEND"}],"id":"block_001","resourceType":"ELEMENT","type":"BLOCK"}]}
    prompts:
      - inputs:
          - ref: input_002
            type: OTP_INPUT
            identifier: otp
            required: true
        action:
          ref: action_001
          nextNode: verify_sms
  - id: verify_sms
    type: TASK_EXECUTION
    properties:
      senderId: "\u003csender-id\u003e"
    executor:
      name: SMSOTPAuthExecutor
      mode: verify
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
