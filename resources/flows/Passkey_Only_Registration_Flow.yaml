# File: Passkey_Only_Registration_Flow.yaml
id: 019bf5b6-b65e-78dc-a93c-713fecf802d3
handle: passkey-authentication-flow
name: Passkey Only Registration Flow
flowType: REGISTRATION
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: ut_res_node
  - id: prompt_identifier
    type: PROMPT
    meta: {"components":[{"id":"text_001","label":"{{ t(signin:heading) }}","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"{{ t(elements:fields.username.label) }}","placeholder":"{{ t(elements:fields.username.placeholder) }}","ref":"username","required":true,"type":"TEXT_INPUT"},{"eventType":"SUBMIT","id":"action_001","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"}]}
    prompts:
      - inputs:
          - ref: input_001
            type: TEXT_INPUT
            identifier: username
            required: true
        action:
          ref: action_001
          nextNode: identity_resolver
  - id: identity_resolver
    type: TASK_EXECUTION
    executor:
      name: IdentityResolver
    onSuccess: passkey_challenge
    onFailure: prompt_identifier
  - id: passkey_challenge
    type: TASK_EXECUTION
    properties:
      relyingPartyId: "localhost"
      relyingPartyName: "Thunder"
    executor:
      name: PasskeyAuthExecutor
      mode: challenge
    onSuccess: passkey_verify
    onFailure: prompt_identifier
  - id: passkey_verify
    type: TASK_EXECUTION
    executor:
      name: PasskeyAuthExecutor
      mode: verify
    onSuccess: prov_node
    onFailure: prompt_identifier
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
  - id: prov_node
    type: TASK_EXECUTION
    executor:
      name: ProvisioningExecutor
    onSuccess: auth_assert
  - id: ut_res_node
    type: TASK_EXECUTION
    meta: {"components":[{"id":"usertype_heading","label":"{{ t(signup:heading) }}","type":"TEXT","variant":"HEADING_2"},{"components":[{"id":"usertype_input","label":"{{ t(elements:fields.usertype.label) }}","placeholder":"{{ t(elements:fields.usertype.placeholder) }}","ref":"userType","required":true,"type":"SELECT"},{"eventType":"SUBMIT","id":"usertype_submit","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"usertype_block","type":"BLOCK"}]}
    executor:
      name: UserTypeResolver
    onSuccess: prompt_identifier
createdAt: 2026-01-25 15:12:30
updatedAt: 2026-01-25 15:12:30


