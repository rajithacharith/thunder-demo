handle: develop-app-flow
name: Develop App Registration Flow test
flowType: REGISTRATION
activeVersion: 2
nodes:
  - id: start
    type: START
    onSuccess: user_type_resolver
  - id: user_type_resolver
    type: TASK_EXECUTION
    meta: {"components":[{"id":"usertype_heading","label":"{{ t(signup:heading) }}","type":"TEXT","variant":"HEADING_2"},{"components":[{"id":"usertype_input","label":"{{ t(elements:fields.usertype.label) }}","placeholder":"{{ t(elements:fields.usertype.placeholder) }}","ref":"userType","required":true,"type":"SELECT"},{"eventType":"SUBMIT","id":"usertype_submit","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"usertype_block","type":"BLOCK"}]}
    executor:
      name: UserTypeResolver
    onSuccess: prompt_registration
  - id: prompt_registration
    type: PROMPT
    meta: {"components":[{"id":"text_001","label":"Sign Up","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"Username","placeholder":"Enter your username","ref":"username","required":true,"type":"TEXT_INPUT"},{"id":"input_002","label":"Password","placeholder":"Enter your password","ref":"password","required":true,"type":"PASSWORD_INPUT"},{"id":"input_003","label":"First Name","placeholder":"Enter your first name","ref":"firstName","required":true,"type":"TEXT_INPUT"},{"id":"input_004","label":"Last Name","placeholder":"Enter your last name","ref":"lastName","required":true,"type":"TEXT_INPUT"},{"id":"input_005","label":"Email Address","placeholder":"Enter your email address","ref":"email","required":true,"type":"EMAIL_INPUT"},{"eventType":"SUBMIT","id":"action_001","label":"Sign Up","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"}]}
    prompts:
      - inputs:
          - ref: input_001
            type: TEXT_INPUT
            identifier: username
            required: true
          - ref: input_002
            type: PASSWORD_INPUT
            identifier: password
            required: true
          - ref: input_003
            type: TEXT_INPUT
            identifier: firstName
            required: true
          - ref: input_004
            type: TEXT_INPUT
            identifier: lastName
            required: true
          - ref: input_005
            type: EMAIL_INPUT
            identifier: email
            required: true
        action:
          ref: action_001
          nextNode: basic_auth
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: provisioning
  - id: provisioning
    type: TASK_EXECUTION
    executor:
      name: ProvisioningExecutor
      inputs:
        - ref: input_001
          type: TEXT_INPUT
          identifier: username
          required: true
        - ref: input_002
          type: PASSWORD_INPUT
          identifier: password
          required: true
        - ref: input_003
          type: TEXT_INPUT
          identifier: firstName
          required: true
        - ref: input_004
          type: TEXT_INPUT
          identifier: lastName
          required: true
        - ref: input_005
          type: EMAIL_INPUT
          identifier: email
          required: true
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
