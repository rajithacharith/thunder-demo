# File: Default_Basic__Google__GitHub_Authentication_Flow.yaml
id: 019b4736-e6cd-74c0-99af-68201730010d
handle: default-basic-google-github-flow
name: Default Basic + Google + GitHub Authentication Flow
flowType: AUTHENTICATION
activeVersion: 2
nodes:
  - id: start
    type: START
    onSuccess: choose_auth
  - id: choose_auth
    type: PROMPT
    actions:
      - ref: action_001
        nextNode: basic_auth
      - ref: action_002
        nextNode: google_auth
      - ref: action_003
        nextNode: github_auth
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: auth_assert
  - id: google_auth
    type: TASK_EXECUTION
    inputs:
      - ref: input_001
        type: TEXT_INPUT
        identifier: code
        required: true
    properties:
      idpId: "\u003cgoogle-idp-id\u003e"
    executor:
      name: GoogleOIDCAuthExecutor
    onSuccess: auth_assert
  - id: github_auth
    type: TASK_EXECUTION
    inputs:
      - ref: input_002
        type: TEXT_INPUT
        identifier: code
        required: true
    properties:
      idpId: "\u003cgithub-idp-id\u003e"
    executor:
      name: GithubOAuthExecutor
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
