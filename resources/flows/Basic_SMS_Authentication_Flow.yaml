# File: Basic_SMS_Authentication_Flow.yaml
id: 019bee7a-0e60-7ed8-a4aa-ee6d100e11c7
handle: auth-flow-basic-sms
name: Basic SMS Authentication Flow
flowType: AUTHENTICATION
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: prompt_credentials
  - id: prompt_credentials
    type: PROMPT
    meta: {"components":[{"id":"text_001","label":"{{ t(signin:heading) }}","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"{{ t(elements:fields.username.label) }}","placeholder":"{{ t(elements:fields.username.placeholder) }}","ref":"username","required":true,"type":"TEXT_INPUT"},{"id":"input_002","label":"{{ t(elements:fields.password.label) }}","placeholder":"{{ t(elements:fields.password.placeholder) }}","ref":"password","required":true,"type":"PASSWORD_INPUT"},{"eventType":"SUBMIT","id":"action_001","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"}]}
    prompts:
      - inputs:
          - ref: input_001
            type: TEXT_INPUT
            identifier: username
            required: true
          - ref: input_002
            type: PASSWORD_INPUT
            identifier: password
            required: true
        action:
          ref: action_001
          nextNode: basic_auth
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: send_sms
  - id: send_sms
    type: TASK_EXECUTION
    properties:
      senderId: "\u003csender-id\u003e"
    executor:
      name: SMSOTPAuthExecutor
      mode: send
    onSuccess: prompt_otp
  - id: prompt_otp
    type: PROMPT
    prompts:
      - inputs:
          - ref: input_002
            type: TEXT_INPUT
            identifier: otp
            required: true
        action:
          ref: action_001
          nextNode: verify_sms
  - id: verify_sms
    type: TASK_EXECUTION
    properties:
      senderId: "\u003csender-id\u003e"
    executor:
      name: SMSOTPAuthExecutor
      mode: verify
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
