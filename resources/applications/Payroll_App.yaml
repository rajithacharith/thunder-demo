# File: Payroll_App.yaml
id: d2e863d8-9bb2-4a66-b661-3d53e4db6611
name: Payroll App
description: Sample Payroll Application with Thunder authentication
auth_flow_id: 019bdaad-a516-75c3-95a7-e5926478be77
registration_flow_id: 019bdaad-a516-71ab-b4f7-912c43bc213d
is_registration_flow_enabled: true
token:
  issuer: https://localhost:8090
  validity_period: 3600
  user_attributes:
    - email
    - name
    - given_name
    - family_name
    - profile
    - picture
    - phone_number
    - address
    - created_at
certificate:
  type: NONE
inbound_auth_config:
  - type: oauth2
    config:
      client_id: {{.PAYROLL_APP_CLIENT_ID}}
      redirect_uris:
        {{- range .PAYROLL_APP_REDIRECT_URIS}}
        - {{.}}
        {{- end}}
      grant_types:
        - authorization_code
        - refresh_token
      response_types:
        - code
      token_endpoint_auth_method: none
      pkce_required: true
      public_client: true
      token:
        issuer: https://localhost:8090
        access_token:
          validity_period: 3600
          user_attributes:
            - email
            - name
            - given_name
            - family_name
            - profile
            - picture
            - phone_number
            - address
            - created_at
        id_token:
          validity_period: 3600
          user_attributes:
            - email
            - name
            - given_name
            - family_name
            - profile
            - picture
            - phone_number
            - address
            - created_at
      scopes:
        - openid
        - profile
        - email


