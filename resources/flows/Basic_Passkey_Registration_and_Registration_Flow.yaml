# File: Basic__Passkey_Registration_and_Registration_Flow.yaml
id: 019bf5b6-b5ff-7769-ae6a-a655fdd839a3
handle: default-basic-passkey-flow
name: Basic + Passkey Registration and Registration Flow
flowType: REGISTRATION
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: ut_res_node
  - id: choose_auth_method
    type: PROMPT
    prompts:
      - inputs:
          - ref: input_username
            type: TEXT_INPUT
            identifier: username
            required: true
          - ref: input_password
            type: PASSWORD_INPUT
            identifier: password
            required: true
        action:
          ref: action_basic
          nextNode: basic_auth
      - action:
          ref: action_passkey
          nextNode: prompt_passkey_identifier
  - id: prompt_passkey_identifier
    type: PROMPT
    prompts:
      - inputs:
          - ref: passkey_username
            type: TEXT_INPUT
            identifier: username
            required: true
        action:
          ref: action_continue
          nextNode: identity_resolver
  - id: identity_resolver
    type: TASK_EXECUTION
    executor:
      name: IdentityResolver
    onSuccess: passkey_challenge
    onFailure: prompt_passkey_identifier
  - id: passkey_challenge
    type: TASK_EXECUTION
    properties:
      relyingPartyName: "Thunder"
      relyingPartyId: "localhost"
    executor:
      name: PasskeyAuthExecutor
      mode: challenge
    onSuccess: passkey_verify
    onFailure: prompt_password_for_registration
  - id: passkey_verify
    type: TASK_EXECUTION
    executor:
      name: PasskeyAuthExecutor
      mode: verify
    onSuccess: prov_node
    onFailure: choose_auth_method
  - id: prompt_password_for_registration
    type: PROMPT
    prompts:
      - inputs:
          - ref: reg_password
            type: PASSWORD_INPUT
            identifier: password
            required: true
        action:
          ref: action_verify_password
          nextNode: basic_auth_for_registration
  - id: basic_auth_for_registration
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: passkey_register_start
    onFailure: prompt_password_for_registration
  - id: passkey_register_start
    type: TASK_EXECUTION
    properties:
      relyingPartyId: "localhost"
      relyingPartyName: "Thunder"
    executor:
      name: PasskeyAuthExecutor
      mode: register_start
    onSuccess: passkey_register_finish
    onFailure: choose_auth_method
  - id: passkey_register_finish
    type: TASK_EXECUTION
    executor:
      name: PasskeyAuthExecutor
      mode: register_finish
    onSuccess: prov_node
    onFailure: choose_auth_method
  - id: basic_auth
    type: TASK_EXECUTION
    executor:
      name: BasicAuthExecutor
    onSuccess: prov_node
    onFailure: choose_auth_method
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
  - id: prov_node
    type: TASK_EXECUTION
    executor:
      name: ProvisioningExecutor
    onSuccess: auth_assert
  - id: ut_res_node
    type: TASK_EXECUTION
    meta: {"components":[{"id":"usertype_heading","label":"{{ t(signup:heading) }}","type":"TEXT","variant":"HEADING_2"},{"components":[{"id":"usertype_input","label":"{{ t(elements:fields.usertype.label) }}","placeholder":"{{ t(elements:fields.usertype.placeholder) }}","ref":"userType","required":true,"type":"SELECT"},{"eventType":"SUBMIT","id":"usertype_submit","label":"{{ t(elements:buttons.submit.text) }}","type":"ACTION","variant":"PRIMARY"}],"id":"usertype_block","type":"BLOCK"}]}
    executor:
      name: UserTypeResolver
    onSuccess: choose_auth_method
createdAt: 2026-01-25 15:12:30
updatedAt: 2026-01-25 15:12:30


